; Smoke-only settings. Source references are relative to src/win32 in the
; locally supplied source. Its AltCursor branch differs from the pinned binary;
; this seed still produces a black menu dump on Windows 6.1. See docs/analysis.md.
[Settings]
; engine/AniDemo.pas:1067-1089 reads the fullscreen choice and resolution.
Windowed=False
; engine/AniDemo.pas:2382-2384,2418-2432 selects an explicit DirectDraw DLL.
CustomDDrawDLL=true
; engine/AniDemo.pas:2427-2432 maps None to the system ddraw.dll.
DDrawVersion=None
; engine/AniDemo.pas:2391-2392 disables opening-player construction.
ShowIntro=false
; engine/AniDemo.pas:2393-2394 disables closing-player construction.
ShowOutro=false
; engine/AniDemo.pas:2397-2398; engine/SoAOS.Animation.pas:814-825 selects the alternate cursor path.
AltCursor=true
; engine/AniDemo.pas:1067-1085 maps 600 to the original 800x600 metrics.
ScreenResolution=600
; interface/SoAOSExtSetting.pas:544,312 reads/saves the D3D vsync preference.
D3DVSync=False
