# game.toml - everything the kit needs to know about Siege of Avalon: Anthology
# with the community 1.19 patch that is not derivable from the binary. The
# patch ships store-specific executables; this port pins the GOG one,
# SiegeGoG.exe (linked 2025-06-09, Embarcadero Delphi), moved over the
# install's Siege.exe. See docs/analysis.md for what it needs from the kit.
#
# Addresses are guest addresses in the pinned executable. The [hooks] values
# are sentinels: they point into the zero-filled section padding after .rsrc
# (0x00d06800-0x00d06fff; SizeOfImage ends the image at 0x00d07000), which
# the game never references, so the kit's hooks compile and never fire. Each
# one is annotated with why this game has no site for it yet.

[game]
id = "siege"
name = "Siege of Avalon: Anthology"
app_name = "SiegeOfAvalonRecomp"
bundle_id = "dev.recompkit.siege"
executable = "Siege.exe"
sha256 = "645eaa1e2725a58163932a1016e6560c174754b0bdd0a2f2970b25a0fe4ba847"
# The community 1.19 patch's GOG executable (SiegeGoG.exe, 2025-06-09) links
# at the usual 0x00400000; the kit takes the base from here
# (RECOMP_IMAGE_BASE) and loads without relocating, which this image allows.
image_base = 0x00400000
entry_point = 0x00841ff8
guest_root = 'C:\GOG Games\Siege of Avalon - Anthology'
# Where a developer checkout finds the game, relative to the repository root.
# tools/setup.py links your installation here; an innoextract of the GOG
# installer placed here directly is accepted too.
developer_exe = "original/patched/Siege.exe"
# The game selects system DirectDraw on Windows 6.1 (default build 7601).
windows_version = "6.1"
# The arena grows past the kit's 256 MB so Dfx_p6s.dll maps at its preferred
# base 0x10000000 (no relocation support; Ghidra cannot rebase the listing).
guest_size = 0x10100000

# DigiFX, the sprite RLE/blit library every draw path calls through
# StartupLibrary's 14-op table. The runtime maps and translates it as a
# second guest image; LoadLibrary("Dfx_p6s.dll") hands out its base.
[modules.aux.dfx]
name = "Dfx_p6s.dll"
path = "original/patched/Dfx_p6s.dll"
sha256 = "cc10def9e5bc97feddd6a07dcfd904484ffe112cbfdaf444554521762dc6bd13"
base = 0x10000000
size = 0x28000
listings = "analysis/decompiled/Dfx_p6s.dll"
# A Borland C++ DLL: no function alignment to lean on.
function_alignment = 1

[translate]
# Listed-start histogram peaks at mod-16 offsets 0, 4, 8, 12: Delphi uses 4-byte alignment.
function_alignment = 4
# Ghidra listing directory holding functions.tsv and functions/*.asm,
# relative to the repository root. tools/analyze.py exports them.
listings = "analysis/decompiled/Siege.exe-1.19"
# Curated symbols, relative to this directory.
globals = "globals.toml"
# Native replacements for translated functions: the software blend the game
# compiles at run time, which translated code cannot execute.
overrides = "native/dxr_blend.h"
# The kit's translator wants a visual-phase counter; this game has none that
# has been audited. Sentinel, and no reads are rewritten.
animation_counter = 0x00a36e00
volatile_reads = []
# Delphi builds an interface adapter for every method an interface exposes:
# "ADD dword ptr [ESP+4], -8" to bias Self, then a JMP to the implementation.
# There are 434 of them in this image and Ghidra lists none - they are packed
# without padding or alignment and are only ever named by a vtable slot. The
# scan does find them, and then withdraws each one because the address they
# all jump to is not an entry point either: 0x00412250 sits in a two-byte gap
# behind FUN_00412228, so nothing lists it. Naming it keeps the thunks, and
# with them every interface call in the game.
#
# Only this one. Eleven other withdrawn targets pass the "looks like code"
# heuristic and most are plainly misdecoded ("ADD AL,0x8B; SALC"); an address
# that fixes nothing is not free, because naming an entry moves the
# boundaries discovery settles on.
# 0x00664a28 is a real function - PUSH EBP; MOV EBP,ESP; MOV ECX,0x3e - in a
# gap, reached through a data pointer when a new game leaves character
# creation. Discovery recovered it, cut it short of its own forward jump to
# 0x00667242, took that jump for a dispatch that went nowhere and withdrew
# the block; the call then returned zero into a JMP EAX trampoline. Named as
# an entry it is decoded whole.
entry_points = [0x00412250, 0x00664a28]

[hooks]
# Every address here is a sentinel: the kit's hooks are shaped by the game the
# kit began with, and nothing in this game has been matched to them yet.
# runtime/kernel32.cpp native_frame_clock: GetTickCount return addresses of
# that game's draw-loop waits. This game imports GetTickCount and
# QueryPerformanceCounter and paces with timeSetEvent; no wait site has been
# identified.
frame_clock_begin = 0x00a36e10
frame_clock_wait = 0x00a36e14
frame_clock_wait_clamp = 0x00a36e18
frame_clock_clamp_deadline = 0x00a36e20
frame_clock_wait_deadline = 0x00a36e24
# dx/ddraw.cpp: mouse-pointer surface globals, for a host-drawn pointer. Not
# identified; the game draws its own cursor from ArtLib sprites.
cursor_surface_ptrs = [0x00a36e30, 0x00a36e34]
# host/input_gate.cpp: a DirectInput mouse device and its vtable. This game
# imports no DirectInput; the VCL delivers mouse input as window messages,
# so these will never be real.
mouse_vtable = 0x00a36e40
mouse_device_ptr = 0x00a36e44
mouse_device_right = 0x00a36e48
# host/smoke_main.cpp: the camera record the smoke script inspects. Not
# identified.
camera = 0x00a36e50

[touch]
# "auto" shows the on-screen keypad when no hardware keyboard is attached.
keypad = "auto"

[setup]
# tools/setup.py: what a supported installation must contain. No annotation
# metadata exists for this executable; tools/analyze.py runs Ghidra's own
# analysis instead of importing one.
required_dirs = ["ArtLib", "Interface", "Maps", "Movies"]

[bundle]
# Left out of the iOS bundle: the installer's redistributables and support
# files, GOG Galaxy metadata, and every Windows DLL the game ships (the FMOD
# 3 and MIDI sound libraries, the DirectDraw compatibility wrapper, the GOG
# Galaxy client and its wrapper, the two Dfx libraries): x86 Windows code
# the kit stands in for or stubs. The WMV movies stay in until the kit
# decides whether it can play them; the game's language files (*.ini) stay.
exclude = ["__redist", "app", "commonappdata", "tmp",
           "*.dll", "*.hashdb", "*.id", "*.info", "*.ico"]
