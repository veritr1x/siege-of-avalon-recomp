# game.toml - everything the kit needs to know about Siege of Avalon: Anthology
# with the community 1.20 patch that is not derivable from the binary. The
# patch ships several executables; this port pins its own Siege.exe (1.20,
# linked 2026-10-06, Embarcadero Delphi), which the patch places over the
# install's. See docs/analysis.md for what it needs from the kit.
#
# Addresses are guest addresses in the pinned executable. The [hooks] values
# are sentinels: they point into the zero-filled section padding after .rsrc
# (0x00e74200-0x00e74fff, between .rsrc and .debug), which
# the game never references, so the kit's hooks compile and never fire. Each
# one is annotated with why this game has no site for it yet.

[game]
id = "siege"
name = "Siege of Avalon: Anthology"
app_name = "SiegeOfAvalonRecomp"
bundle_id = "dev.recompkit.siege"
executable = "Siege.exe"
sha256 = "702a7f25dbe7220d172929dff44eeb5f5d080004fde926b4b4c41ada4a81e019"
# The community 1.20 patch's own Siege.exe (2026-10-06), whose launcher reads
# 1.20: an ordinary Delphi image - 4.7 MB of code and a 16 MB TD32 .debug
# section - linked at 0x00800000. The kit takes the base from here
# (RECOMP_IMAGE_BASE) and loads without relocating, which this image allows.
# The patch's SiegeGoG.exe, pinned until 2026-09-16, is the same game built
# for GOG but labelled 1.17.1.
image_base = 0x00800000
entry_point = 0x00c7e218
guest_root = 'C:\GOG Games\Siege of Avalon - Anthology'
# Where a developer checkout finds the game, relative to the repository root.
# tools/setup.py links your installation here; an innoextract of the GOG
# installer placed here directly is accepted too.
developer_exe = "original/patched/Siege.exe"
# The game selects system DirectDraw on Windows 6.1 (default build 7601).
windows_version = "6.1"
# The first 1.20 map requests a 161 MB contiguous allocation in addition to
# its existing assets. A 1 GiB arena leaves room for those working buffers.
# DigiFX is relocated below the heap so its old preferred 0x10000000 base
# cannot cap the runtime's allocation regions at 256 MiB.
heap_base = 0x02000000

guest_size = 0x40000000

[modules.aux.dfx]
name = "Dfx_p6s.dll"
path = "original/patched/Dfx_p6s.dll"
sha256 = "cc10def9e5bc97feddd6a07dcfd904484ffe112cbfdaf444554521762dc6bd13"
# The unchanged DLL has 5,737 HIGHLOW relocations. It clears the main image
# (ending at 0x01db6000) and its 0x28000 bytes end below the 32 MiB heap.
base = 0x01e00000
size = 0x28000
listings = "analysis/decompiled/Dfx_p6s.dll"
function_alignment = 1

[translate]
# Listed-start histogram peaks at mod-16 offsets 0, 4, 8, 12: Delphi uses 4-byte alignment.
function_alignment = 4
# Ghidra listing directory holding functions.tsv and functions/*.asm,
# relative to the repository root. tools/analyze.py exports them.
listings = "analysis/decompiled/Siege.exe-1.20-patch"
# Curated symbols, relative to this directory.
globals = "globals.toml"
# Native replacements for translated functions: the software blends the game
# compiles at run time, which translated code cannot execute
# (dxrCopyRectBlend and dxrFillRectColorBlend in this image), and the 1080
# layout fitted to the display's shape (native/screen_layout.h).
overrides = "native/siege_native.h"
# The kit's translator wants a visual-phase counter; this game has none that
# has been audited. Sentinel, and no reads are rewritten.
animation_counter = 0x00e74e00
volatile_reads = []
# Event handlers bound by name through Delphi RTTI need verified entries
# if discovery cannot reach them. Addresses from earlier patch builds must
# never be carried forward to another image.
# TD32 System.IOUtils.TPath.Create is invoked through the unit table, but
# Ghidra omitted its body. Seeding its real entry preserves all three
# finally continuations and the frame-restoring epilogue at 0x00c7d275.
# TD32 TJclTD32InfoParser.AnalyseAlignSymbols is 498 bytes at 0x00a30e54.
# A weak fragment otherwise owns the switch cases and turns its record loop
# into mutually recursive host calls. Keep the whole verified function.
entry_points = [0x00a30e54, 0x00c7ce10]
# The program body ends CALL System._Halt0 at 0x00c7e3c5. Ghidra then
# misdecodes its inline UTF-16 mutex/title strings, including the Delphi
# UnicodeString header at 0x00c7e400, as instructions. These bytes are data:
# keep them out of discovery and fail if a real branch ever names them.
untranslated_ranges = [{start = 0x00c7e3ca, end = 0x00c7e42c, on_branch = "fail"}]

[hooks]
# Every address here is a sentinel: the kit's hooks are shaped by the game the
# kit began with, and nothing in this game has been matched to them yet.
# runtime/kernel32.cpp native_frame_clock: GetTickCount return addresses of
# that game's draw-loop waits. This game imports GetTickCount and
# QueryPerformanceCounter and paces with timeSetEvent; no wait site has been
# identified.
frame_clock_begin = 0x00e74e10
frame_clock_wait = 0x00e74e14
frame_clock_wait_clamp = 0x00e74e18
frame_clock_clamp_deadline = 0x00e74e20
frame_clock_wait_deadline = 0x00e74e24
# dx/ddraw.cpp: mouse-pointer surface globals, for a host-drawn pointer. Not
# identified; the game draws its own cursor from ArtLib sprites.
cursor_surface_ptrs = [0x00e74e30, 0x00e74e34]
# host/input_gate.cpp: a DirectInput mouse device and its vtable. This game
# imports no DirectInput; the VCL delivers mouse input as window messages,
# so these will never be real.
mouse_vtable = 0x00e74e40
mouse_device_ptr = 0x00e74e44
mouse_device_right = 0x00e74e48
# host/smoke_main.cpp: the camera record the smoke script inspects. Not
# identified.
camera = 0x00e74e50

# The on-screen controls. Every binding here is a key the game actually
# dispatches: TKeyEvent.FormKeyDown (interface/SoAOS.Intrface.KeyEvents.pas in
# the community source under analysis/source/sneg-1.04, the unit this build's
# [keyboard] remap panel feeds) is a single case on the virtual key, and the
# shipped original/patched/siege.ini [keyboard] block binds the same defaults
# (combat=32, inventory=73, statistic=67, spellbar=83, journal=74, xray=88,
# quicksave=113). A player who remaps that block is remapping what these pad
# buttons send, which is the behaviour the game already has for a keyboard.
[controls]
# "pad+keys": the pad alone cannot finish the game. Character creation names
# the character and Save names a game, both typed into a VCL edit, and the
# spell hotkeys are the digits and F3-F12 (FormKeyDown 48..57 -> SpellHotKey,
# 114..124 -> SpellHotKeyPlus), which no thirteen-button pad can hold. The
# kit's built-in keys layout is a full split keyboard, so the KEYS tab covers
# both; the pad covers everything a hand needs while walking and fighting.
default_layout = "pad+keys"
# "mapped": this game reads no joystick. It imports no DirectInput (see the
# [hooks] note above) and no XInput; the VCL delivers mouse and key messages.
pad = "mapped"

[controls.mapped]
# Both sticks drive the cursor. Siege is click-to-move and click-to-attack
# (TfrmMain.AniView1MouseDown: mbLeft walks, runs or attacks, mbRight casts)
# and every panel is a hit rectangle, so pointing is the whole game; there is
# nothing else continuous to drive, because the camera follows the player and
# FormKeyDown reads no arrow key, the form has no OnMouseWheel handler, and
# no unit reads WASD. Either thumb can therefore point, and the dpad, which
# can only send arrows or WASD, is left off rather than sending keys the game
# discards.
left_stick = "cursor"
right_stick = "cursor"
dpad = "none"
# The kit default. The sidebar and bottom bar are small hit rectangles at
# 1080 and the speed follows the square of the deflection, so a half-pushed
# stick still lands on an inventory slot.
cursor_speed = 900
# Move, attack, and every button in the interface.
cross = "mouse_left"
# Cast the current spell: Current.Cast on the highlighted figure, else
# Current.CastPoint at the tile.
circle = "mouse_right"
# VK_SPACE -> ToggleCombat, the one toggle a fight needs.
square = "key:Space"
# 73 -> DlgInventory, the most-opened screen.
triangle = "key:I"
# 67 -> DlgStatistics: the character sheet, where training points are spent.
l1 = "key:C"
# 83 -> ToggleSpell opens the spell bar. One button reaches every spell by
# tapping a glyph, which is why the digit hotkeys are not worth pad buttons.
r1 = "key:S"
# VK_TAB -> ShowPersistentMap, the overlay map, held open while travelling.
l2 = "key:Tab"
# Shift is the force-attack modifier: with it held, a left click on a
# character sets AutoFight and attacks instead of walking.
r2 = "key:LShift"
# The stick clicks are the awkward seats, so they take the two toggles a
# player can wait a moment for: 74 -> DlgJournal, 88 -> ToggleXRay
# (AutoTransparent, to see the party behind a wall).
l3 = "key:J"
r3 = "key:X"
# VK_F2 -> QuickSave, which writes the save and its screenshot.
select = "key:F2"
# VK_ESCAPE -> ShowMenu: it closes whichever dialog is open, and on a clear
# screen posts WM_StartMainMenu, where Save, Load and Options live.
start = "key:Escape"
# The kit's own settings page, and through it the layout editor. Bound as the
# action rather than as F10, because 121 is a spell hotkey in this game
# (FormKeyDown 114..124) and the key must reach the guest.
ps = "action:settings"
#
# Deliberately unbound: 68/69 (mana and health potion) and 84 (fast travel)
# read Modselection and do nothing outside Ashes of Avalon, so they would be
# dead buttons in the Anthology campaign; 65 titles, 66 battle cry, 76
# adventure log, 77 map, 79 options, 81 quest log, 82 roster, 71 screenshot
# and 80 pause all have buttons in the game's own bottom bar or sidebar, which
# the cursor reaches. This repository ships no layouts/: the kit's built-in
# tablet pad and split keyboard already put every one of these within a thumb,
# and nothing about this game wants a different pad geometry.

[mods]
# The mod runtime's Populous integrations hook Populous routines by address;
# this game has none of them.
builtin = "none"

[settings]
# The F10 page's rows. The renderer rows drive Populous's Direct3D renderer
# and frame loop; Siege draws through Direct3D 11 and its own pacing.
rows = ["window", "performance_overlay", "controls"]

[launcher]
# The launcher (kit host/launcher/): what it calls the game, the folder names
# and GOG id it looks for (goggame-2085372274.info in the GOG install), and
# the headroom an import leaves free.
title = "Siege of Avalon: Anthology"
install_names = ["Siege of Avalon Anthology", "Siege of Avalon"]
gog_ids = ["2085372274"]
min_free_mb = 300

[setup]
# tools/setup.py: what a supported installation must contain. No annotation
# metadata exists for this executable; tools/analyze.py runs Ghidra's own
# analysis instead of importing one.
required_dirs = ["ArtLib", "Interface", "Maps", "Movies"]

[bundle]
# Left out of the iOS bundle: the installer's redistributables and support
# files, GOG Galaxy metadata, and every Windows DLL the game ships (the FMOD
# 3 and MIDI sound libraries, the DirectDraw compatibility wrapper, the GOG
# Galaxy client and its wrapper, the two Dfx libraries): x86 Windows code
# the kit stands in for or stubs. The WMV movies stay in until the kit
# decides whether it can play them; the game's language files (*.ini) stay.
# The patch's other executables (the Steam and older builds, its launcher
# tools) are left out by name: a *.exe pattern would drop Siege.exe too.
exclude = ["__redist", "app", "commonappdata", "tmp",
           "*.dll", "*.hashdb", "*.id", "*.info", "*.ico",
           "Siege_*.exe", "Siege-*.exe", "SiegeGoG.exe", "SiegeSteam.exe", "SoA*.exe"]
